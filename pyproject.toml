[build-system]
requires      = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution: `docrepair-tools`. The console script stays
# `glyph-audit` and the import package stays `GlyphAudit` — only the
# distribution name is the umbrella brand, so existing imports and
# `glyph-audit ...` commands are unchanged.
name            = "docrepair-tools"
version         = "0.2.0"
description     = "DocRepair tools: tiered coverage/width audit + live proofing pipeline for building metrics-compatible fonts (Google Fonts docrepair project)."
readme          = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license         = { file = "LICENSE" }
authors         = [{ name = "Agyei Archer" }]
keywords        = [
    "fonts", "typography", "opentype", "glyphs", "fontmake",
    "font-audit", "type-design", "metrics", "proofing",
]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Text Processing :: Fonts",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fontTools>=4.40",
    "tomli>=1.2; python_version < '3.11'",
]

[project.optional-dependencies]
glyphs = ["glyphsLib>=6.0"]
claude = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
gemini = ["google-generativeai>=0.5"]
ai     = ["anthropic>=0.30", "openai>=1.0", "google-generativeai>=0.5"]
# `proof` bundles the extras `glyph-audit proof …` subcommands need to run
# the full pipeline: `fontc` for compilation, `watchdog` for --watch, and
# `glyphsLib` so the source-side FontView is available to the panel.
proof  = ["fontc>=0.1", "watchdog>=3.0", "glyphsLib>=6.0"]
all    = [
    "glyphsLib>=6.0",
    "watchdog>=3.0",
    "fontc>=0.1",
    "anthropic>=0.30",
    "openai>=1.0",
    "google-generativeai>=0.5",
]

[project.scripts]
glyph-audit = "GlyphAudit.cli:main"

[project.urls]
Homepage      = "https://github.com/agyeiagyeiagyei/docrepairtools"
Repository    = "https://github.com/agyeiagyeiagyei/docrepairtools"
Issues        = "https://github.com/agyeiagyeiagyei/docrepairtools/issues"
Documentation = "https://github.com/agyeiagyeiagyei/docrepairtools#readme"
Changelog     = "https://github.com/agyeiagyeiagyei/docrepairtools/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where   = ["src"]
include = ["GlyphAudit*"]
# Explicit exclude: without it setuptools's package-discovery walks INTO
# webapp/node_modules and picks up any stray .py file (e.g.
# node_modules/flatted/python/flatted.py) as a sub-sub-package. Cost is
# a few KB of bloat in the wheel + a random import path a user could
# stumble into. `webapp` itself is included via the package_data glob
# below; only its dependency dumping ground is excluded.
exclude = ["GlyphAudit.proof.webapp.node_modules*",
           "GlyphAudit.proof.webapp.src*"]

[tool.setuptools.package-data]
GlyphAudit = [
    "prompts/*.md",
    "examples/*.example",
    "examples/*.toml",
]
# The prebuilt Vite bundle for `glyph-audit proof serve`. `dist/` is produced
# by `cd src/GlyphAudit/proof/webapp && npm run build` before packaging;
# release scripts must call it or the wheel ships without a UI. The `src/`
# subdirectory is deliberately NOT shipped — end users install and run the
# prebuilt bundle; hackers work from a source checkout instead.
"GlyphAudit.proof.webapp" = [
    "dist/index.html",
    "dist/assets/*",
    "dist/assets/**/*",
]
