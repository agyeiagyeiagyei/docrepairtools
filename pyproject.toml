[build-system]
requires      = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "glyph-audit"
version         = "0.1.0"
description     = "Tiered coverage and width comparison between a target font and one or more reference fonts."
readme          = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license         = { file = "LICENSE" }
authors         = [{ name = "Agyei Archer" }]
keywords        = [
    "fonts", "typography", "opentype", "glyphs", "fontmake",
    "font-audit", "type-design", "metrics", "proofing",
]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Text Processing :: Fonts",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fontTools>=4.40",
    "tomli>=1.2; python_version < '3.11'",
]

[project.optional-dependencies]
glyphs = ["glyphsLib>=6.0"]
claude = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
gemini = ["google-generativeai>=0.5"]
ai     = ["anthropic>=0.30", "openai>=1.0", "google-generativeai>=0.5"]
all    = [
    "glyphsLib>=6.0",
    "anthropic>=0.30",
    "openai>=1.0",
    "google-generativeai>=0.5",
]

[project.scripts]
glyph-audit = "GlyphAudit.cli:main"

[project.urls]
Homepage      = "https://github.com/agyeiagyeiagyei/GlyphAudit"
Repository    = "https://github.com/agyeiagyeiagyei/GlyphAudit"
Issues        = "https://github.com/agyeiagyeiagyei/GlyphAudit/issues"
Documentation = "https://github.com/agyeiagyeiagyei/GlyphAudit#readme"
Changelog     = "https://github.com/agyeiagyeiagyei/GlyphAudit/releases"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where   = ["src"]
include = ["GlyphAudit*"]

[tool.setuptools.package-data]
GlyphAudit = [
    "prompts/*.md",
    "examples/*.example",
    "examples/*.toml",
]
